name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - run: python -m unittest discover -s tests -v

  template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets/remotion-template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --no-audit --no-fund
      - run: npx remotion still src/index.jsx VerticalImpact /tmp/cover.png --frame 0 --log=error
      - name: Every sample scene fits above the captions
        run: node check-layout.mjs --min-fit 0.85
      - name: Render both covers
        run: |
          npx remotion still src/index.jsx Cover /tmp/components-cover-9x16.png --log=error
          npx remotion still src/index.jsx Cover34 /tmp/components-cover-3x4.png --log=error
      - name: Render reusable motion components
        run: |
          npx remotion still src/index.jsx ComponentsDemo /tmp/components-start.png --frame 0 --log=error
          npx remotion still src/index.jsx ComponentsDemo /tmp/components-click.png --frame 62 --log=error
          npx remotion still src/index.jsx ComponentsDemo /tmp/components-result.png --frame 210 --log=error
          npx remotion still src/index.jsx ToolkitPreview /tmp/components-toolkit.png --frame 20 --log=error
      - uses: actions/upload-artifact@v4
        with:
          name: components-demo-stills
          path: /tmp/components-*.png
